[package]
name = "ai-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.38"
build-time = "0.1"
regex = "1.10"
dirs = "5.0.1"
lettre = { version = "0.11.10", features = ["smtp-transport", "builder", "native-tls", "tokio1-native-tls"] }
clap = { version = "4.5", features = ["derive"] }
difference = "2.0"
console = "0.16"
anyhow = "1.0"
dunce = "1.0"

readability = "0.3"
futures = "0.3"
config = "0.14"
shell-words = "1.1"
patch-apply = "0.8"
rig = "0.37"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tavily = "2.0"
pithy = "0.1"

once_cell = "1.19"

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
